<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harshith Padakanti / Wrong door</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .nf {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      align-items: center;
      padding: 5rem var(--gutter) 2rem;
      gap: 3rem;
    }
    .nf-text h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.1;
      margin-bottom: 1.2rem;
      color: #ffffff;
    }
    .nf-text p {
      color: var(--text-muted);
      max-width: 38ch;
      margin-bottom: 2rem;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .nf-img {
      height: 75vh;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      background: var(--bg-surface);
    }
    .nf-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.88) brightness(0.85);
    }
    @media (max-width: 900px) {
      .nf {
        grid-template-columns: 1fr;
        padding-top: 6rem;
      }
      .nf-img {
        height: 44vh;
      }
    }
  </style>
</head>
<body class="archive-body">
  <header class="nav-bar">
    <a href="index.html" class="nav-brand">HARSHITH PADAKANTI / ARCHIVE</a>
    <div class="nav-chapter">NOT A CHAPTER / 404</div>
  </header>

  <main class="nf container">
    <div class="nf-text">
      <div class="mono" style="margin-bottom: 1.4rem; color: var(--accent-gold);">ERROR : 404</div>
      <h1>Wrong door.</h1>
      <p>Every other path on this site leads to an archive entry or shipped project. This is the sole exception.</p>
      <a href="index.html" class="action-btn primary">RETURN TO ARCHIVE ORIGIN &rarr;</a>
    </div>
    <div class="nf-img">
      <img src="img/imagined_threshold.jpg" alt="A door standing alone in the desert opening onto a rainy city" />
    </div>
  </main>
</body>
</html>
